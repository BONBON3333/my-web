<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フラスタ協賛者様</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:        #0a1230;
  --bg-mid:    #121d45;
  --bg-soft:   #1a2757;
  --text:      #eef1fb;
  --sub:       #93a0ca;
  --orange:    #f0862a;
  --orange-l:  #f7b26b;
  --blue:      #5a86ff;
  --teal:      #45c4c9;
  --indigo:    #8b7cf0;
  --amber:     #f0a23a;
  --card-bg:   rgba(255,255,255,0.05);
  --card-border: rgba(240,134,42,0.18);
}

body {
  font-family: 'Zen Maru Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
}

/* ===== 全体の淡い星の背景 ===== */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(circle, rgba(240,178,107,0.14) 1.1px, transparent 1.1px);
  background-size: 34px 34px;
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(90,134,255,0.18), transparent 60%);
  pointer-events: none; z-index: 0;
}

/* ===== 立札バナー ===== */
.banner {
  position: relative; z-index: 1;
  width: 100%;
  line-height: 0;
}
.banner img {
  width: 100%;
  display: block;
  object-fit: cover;
  max-height: 320px;
  object-position: center 30%;
}
.banner-fade {
  position: relative; z-index: 1;
  height: 70px; margin-top: -70px;
  background: linear-gradient(to bottom, transparent, var(--bg));
  pointer-events: none;
}

/* ===== HERO ===== */
.hero {
  position: relative; z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 24px 0;
  text-align: center;
}

.hero-eyebrow {
  font-size: 11px; letter-spacing: 5px; font-weight: 700;
  color: var(--orange-l);
  text-transform: uppercase;
  margin-bottom: 18px;
  opacity: 0.85;
}

.hero h1 {
  font-family: 'Shippori Mincho', serif;
  font-size: clamp(25px, 4vw, 34px);
  line-height: 1.5;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--orange);
  margin-bottom: 18px;
}

.hero h1 em {
  font-style: normal;
}

.hero-sub {
  font-size: clamp(13px, 2vw, 15px);
  color: var(--sub);
  line-height: 2;
  font-weight: 400;
  margin-bottom: 20px;
  max-width: 480px;
}

/* ===== イラストエリア（背景に溶け込むように「生やす」） ===== */
:root { --illust-h: 500px; }

.illust-frame {
  position: relative;
  width: min(1300px, 78vw);
  height: var(--illust-h);
  margin: 0 auto;
  overflow: visible;
}

/* 足元のグロー：キャラクターが光の中から立ち上がっているように見せる */
.illust-frame::before {
  content: '';
  position: absolute;
  left: 50%; bottom: 6%;
  width: 78%; height: 46%;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(90,134,255,0.35), rgba(240,134,42,0.12) 55%, transparent 75%);
  filter: blur(6px);
  z-index: 0;
}

.illust-frame img {
  position: relative; z-index: 1;
  width: 100%; height: 100%;
  object-fit: contain;
  object-position: bottom;
  display: block;
  /* 上下をふわっとフェードさせて背景に溶け込ませる */
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 92%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 92%, transparent 100%);
  filter: drop-shadow(0 18px 32px rgba(0,0,0,0.45));
}

/* 画像未設定プレースホルダー */
.illust-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--sub); font-size: 13px; gap: 10px; text-align: center; padding: 24px;
}
.illust-placeholder span { font-size: 40px; }

/* ===== 区切り装飾 ===== */
.divider {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  gap: 16px; padding: 24px 24px 40px;
}
.divider-line {
  flex: 1; max-width: 120px; height: 1px;
  background: linear-gradient(to right, transparent, rgba(240,134,42,0.4));
}
.divider-line.r { background: linear-gradient(to left, transparent, rgba(240,134,42,0.4)); }
.divider-flowers { font-size: 18px; letter-spacing: 8px; opacity: 0.7; }

/* ===== COUNT BADGE ===== */
.count-badge {
  position: relative; z-index: 1;
  text-align: center; padding: 0 24px 36px;
}
.count-badge span {
  display: inline-block;
  background: linear-gradient(120deg, var(--orange), var(--blue));
  color: #08102b; font-size: 13px; font-weight: 900;
  padding: 7px 24px; border-radius: 99px; letter-spacing: 2px;
  box-shadow: 0 4px 20px rgba(240,134,42,0.25);
}

/* ===== MARQUEE ===== */
.marquee-section {
  position: relative; z-index: 1;
  overflow: hidden; padding: 8px 0;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
}
.marquee-lane {
  display: flex; gap: 16px;
  width: max-content; margin-bottom: 16px;
  animation: scrollLeft 38s linear infinite;
}
.marquee-lane.reverse { animation: scrollRight 44s linear infinite; }
.marquee-lane.slow    { animation: scrollLeft  54s linear infinite; }
@keyframes scrollLeft  { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
@keyframes scrollRight { 0%{transform:translateX(-50%)} 100%{transform:translateX(0)} }
.marquee-section:hover .marquee-lane { animation-play-state: paused; }

/* ===== CARD ===== */
.card {
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  padding: 18px 18px 15px;
  width: 218px; flex-shrink: 0;
  backdrop-filter: blur(8px);
  position: relative; overflow: hidden;
  transition: transform .25s ease, box-shadow .25s ease;
  cursor: default;
  box-shadow: 0 2px 12px rgba(0,0,0,0.25);
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  border-radius: 18px 18px 0 0;
}
.card[data-color="blue"]::before   { background: linear-gradient(90deg,#5a86ff,#8fb2ff); }
.card[data-color="indigo"]::before { background: linear-gradient(90deg,#8b7cf0,#5a86ff); }
.card[data-color="teal"]::before   { background: linear-gradient(90deg,#45c4c9,#5a86ff); }
.card[data-color="amber"]::before  { background: linear-gradient(90deg,#f0a23a,#f0862a); }
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 28px rgba(90,134,255,0.2);
}

.card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.card-icon {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.card[data-color="blue"]   .card-icon { background: linear-gradient(135deg,#1a2757,#2a3c85); }
.card[data-color="indigo"] .card-icon { background: linear-gradient(135deg,#241a57,#3a2c85); }
.card[data-color="teal"]   .card-icon { background: linear-gradient(135deg,#0f2a2c,#1c4a4d); }
.card[data-color="amber"]  .card-icon { background: linear-gradient(135deg,#3a2a10,#5a3f16); }

.card-name { font-size: 14px; font-weight: 900; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sns  {
  font-size: 11px; font-weight: 700; text-decoration: none;
  display: inline-block; margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%;
}
.card[data-color="blue"]   .card-sns { color: var(--blue); }
.card[data-color="indigo"] .card-sns { color: var(--indigo); }
.card[data-color="teal"]   .card-sns { color: var(--teal); }
.card[data-color="amber"]  .card-sns { color: var(--amber); }
.card-sns:hover { opacity: 0.75; }

.card-message {
  font-size: 11px; line-height: 1.8; color: var(--sub);
  border-top: 1px solid rgba(240,134,42,0.15);
  padding-top: 9px; margin-top: 3px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card-message.hidden { display: none; }

/* ===== MESSAGE MODAL ===== */
.message-modal {
  position: fixed; inset: 0; z-index: 9999;
  display: none; align-items: center; justify-content: center;
  padding: 24px;
  background: rgba(5, 9, 25, 0.78);
  backdrop-filter: blur(8px);
}
.message-modal.open { display: flex; }
.message-modal-box {
  width: min(520px, 92vw);
  max-height: min(78vh, 680px);
  overflow-y: auto;
  background: #111a3d;
  border: 1.5px solid rgba(240,134,42,.35);
  border-radius: 22px;
  padding: 26px 24px 22px;
  box-shadow: 0 20px 70px rgba(0,0,0,.55);
}
.message-modal-top {
  display: flex; align-items: center; gap: 12px;
  padding-bottom: 15px; margin-bottom: 15px;
  border-bottom: 1px solid rgba(240,134,42,.18);
}
.message-modal-icon { font-size: 30px; }
.message-modal-name {
  font-size: 17px; font-weight: 900; color: var(--text);
  overflow-wrap: anywhere;
}
.message-modal-text {
  font-size: 13px; line-height: 2; color: var(--sub);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.message-modal-close {
  display: block; margin: 18px auto 0;
  border: 1px solid rgba(240,134,42,.35);
  background: transparent; color: var(--sub);
  border-radius: 999px; padding: 8px 20px;
  font: inherit; font-size: 11px; cursor: pointer;
}
.message-modal-close:hover { color: var(--text); }
.card:has(.card-message:not(.hidden)) { cursor: pointer; }

/* ===== FOOTER ===== */
.footer-divider {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  gap: 16px; padding: 48px 24px 32px;

.footer-area {
  position: relative; z-index: 1;

.footer-area .thanks {

  font-weight: 600; letter-spacing: 4px;

  margin-bottom: 16px;

.footer-area .thanks em {

.footer-area p { font-size: 13px; color: var(--sub); line-height: 2.2; }
.footer-flowers { font-size: 20px; letter-spacing: 10px; opacity: 0.6; margin-top: 28px; }
</style>
</head>

const COLORS = ["blue","indigo","teal","amber"];
const EMOJIS = ["🌸","🌷","🌼","🌺","🌻","💐","🌹","⭐","🌈","🦋","🎀","💫","✨","🎵","🍀"];
const LANES  = 3;

function buildCard(p, idx) {
  const color = COLORS[idx % COLORS.length];
  const emoji = p.emoji || EMOJIS[idx % EMOJIS.length];
  const card  = document.createElement('div');
  card.className = 'card';
  card.dataset.color = color;
  const snsHTML = p.sns && p.url
    ? `<a class="card-sns" href="${p.url}" target="_blank">${p.sns}</a>`
    : p.sns ? `<span class="card-sns" style="cursor:default">${p.sns}</span>` : '';
  const msgHTML = p.msg
    ? `<div class="card-message">${p.msg}</div>`
    : `<div class="card-message hidden"></div>`;
  card.innerHTML = `
    <div class="card-top">
      <div class="card-icon">${emoji}</div>
      <div style="min-width:0;flex:1">
        <div class="card-name">${p.name}</div>
        ${snsHTML}
      </div>
    </div>${msgHTML}`;
  return card;
}

function buildLanes() {
  const section = document.getElementById('marquee-section');
  const groups  = Array.from({length: LANES}, () => []);
  PARTICIPANTS.forEach((p, i) => groups[i % LANES].push({p, i}));
  const laneClasses = ['', 'reverse', 'slow'];
  groups.forEach((group, li) => {
    if (!group.length) return;
    const lane = document.createElement('div');
    lane.className = `marquee-lane ${laneClasses[li]}`;
    [0, 1].forEach(() => group.forEach(({p, i}) => lane.appendChild(buildCard(p, i))));
    section.appendChild(lane);
  });
}
const messageModal = document.getElementById('messageModal');
const modalIcon = document.getElementById('modalIcon');
const modalName = document.getElementById('modalName');
const modalText = document.getElementById('modalText');
const modalClose = document.getElementById('modalClose');

function closeMessageModal() {
  messageModal.classList.remove('open');
  messageModal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  document.querySelectorAll('.marquee-lane').forEach(lane => {
    lane.style.animationPlayState = '';
  });
}

document.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  if (e.target.closest('a')) return;
  const message = card.querySelector('.card-message:not(.hidden)');
  if (!message) return;

  modalIcon.textContent = card.querySelector('.card-icon')?.textContent || '💬';
  modalName.textContent = card.querySelector('.card-name')?.textContent || '';
  modalText.textContent = message.textContent || '';
  messageModal.classList.add('open');
  messageModal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.querySelectorAll('.marquee-lane').forEach(lane => {
    lane.style.animationPlayState = 'paused';
  });
});

modalClose.addEventListener('click', closeMessageModal);
messageModal.addEventListener('click', (e) => {
  if (e.target === messageModal) closeMessageModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && messageModal.classList.contains('open')) closeMessageModal();
});

buildLanes();
</script>
